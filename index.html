<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anti-Inflammatory Challenge · Couple Check-in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
    tailwind.config={theme:{extend:{fontFamily:{kai:['Inter','system-ui','sans-serif']},colors:{cream:'#F7F3EC',forest:'#2D6A4F',mint:'#52B788',terra:'#E76F51',bark:'#1B1B1B',sand:'#E5E0D8'}}}}
    </script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;background:#F7F3EC;color:#1B1B1B;overflow-x:hidden;min-height:100dvh}
        .blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.22;pointer-events:none;z-index:0}
        .blob-1{width:300px;height:300px;background:#52B788;top:-80px;right:-60px;animation:bf 18s ease-in-out infinite}
        .blob-2{width:250px;height:250px;background:#E76F51;bottom:10%;left:-80px;animation:bf 22s ease-in-out infinite reverse}
        .blob-3{width:200px;height:200px;background:#F4A261;top:40%;right:-50px;animation:bf 15s ease-in-out infinite 3s}
        @keyframes bf{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.05)}66%{transform:translate(-20px,15px) scale(.95)}}
        .page{display:none;animation:fsi .35s ease}.page.active{display:block}
        @keyframes fsi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .progress-ring{transform:rotate(-90deg)}.progress-ring__bg{stroke:#E5E0D8}.progress-ring__fill{transition:stroke-dashoffset .8s ease}
        .fire{display:inline-block;animation:fl .8s ease-in-out infinite alternate}
        @keyframes fl{0%{transform:scale(1) rotate(-3deg)}100%{transform:scale(1.1) rotate(3deg)}}
        input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#E5E0D8;outline:none}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#2D6A4F;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .15s}
        input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
        .nav-item{transition:all .25s;position:relative}.nav-item.active{color:#2D6A4F}
        .nav-item.active::before{content:'';position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:20px;height:3px;background:#2D6A4F;border-radius:2px}
        .cal-day{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all .2s}
        .cal-day:hover{transform:scale(1.08)}.cal-day.checked{background:#D8F3DC;color:#2D6A4F;font-weight:700}
        .cal-day.cheated{background:#FEE2E2;color:#DC2626;font-weight:700}.cal-day.missed{background:#F3F0EB;color:#9CA3AF}
        .cal-day.future{color:#D1D5DB;cursor:default}.cal-day.future:hover{transform:none}.cal-day.today{box-shadow:0 0 0 2px #2D6A4F}
        .mo{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center}
        .mo.show{display:flex;animation:fi .2s ease}
        .mc{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;animation:su .3s ease}
        @keyframes fi{from{opacity:0}to{opacity:1}}@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);z-index:200;padding:12px 24px;border-radius:12px;color:#fff;font-size:14px;font-weight:700;transition:transform .4s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
        .toast.show{transform:translateX(-50%) translateY(0)}.toast.success{background:#2D6A4F}.toast.error{background:#DC2626}.toast.info{background:#E76F51}
        .card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.03);border:1px solid #F0ECE4}
        .ip{position:fixed;inset:0;z-index:150;background:#F7F3EC;display:flex;align-items:center;justify-content:center;overflow-y:auto}
        .ip.hidden{display:none}.il{font-size:48px;color:#52B788;animation:ls 3s ease-in-out infinite}
        @keyframes ls{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.05)}}
        .db{padding:8px 20px;border-radius:10px;border:2px solid #E5E0D8;cursor:pointer;transition:all .2s;font-family:inherit;font-size:15px;background:transparent;color:#6B7280}
        .db.active{border-color:#2D6A4F;background:#D8F3DC;color:#2D6A4F;font-weight:700}.db:hover{border-color:#52B788}
        #cc{position:fixed;inset:0;z-index:300;pointer-events:none;display:none}
        .inf{width:100%;padding:12px 16px;border-radius:12px;border:2px solid #E5E0D8;font-family:inherit;font-size:15px;background:#FAFAF8;transition:border-color .2s;outline:none}
        .inf:focus{border-color:#52B788}.inf::placeholder{color:#BDB9B0}textarea.inf{resize:none;min-height:60px}
        .ft{display:inline-block;padding:5px 12px;border-radius:20px;font-size:13px;background:#F0F7F2;color:#2D6A4F;margin:3px;transition:all .2s;cursor:default}
        .ft:hover{background:#D8F3DC;transform:scale(1.03)}
        .sd{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}.sd.on{background:#2D6A4F;box-shadow:0 0 6px rgba(45,106,79,.5)}.sd.off{background:#D1D5DB}
        details summary{list-style:none}details summary::-webkit-details-marker{display:none}
        details summary::after{content:'\f078';font-family:'Font Awesome 6 Free';font-weight:900;font-size:10px;margin-left:4px;transition:transform .2s}
        details[open] summary::after{transform:rotate(180deg)}
        .sn{width:22px;height:22px;border-radius:50%;background:#2D6A4F;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#D1CCC4;border-radius:2px}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>
</head>
<body>
<div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
<canvas id="cc"></canvas><div id="toast" class="toast"></div>

<!-- Setup page -->
<div id="initPage" class="ip">
<div class="w-full max-w-sm px-6 py-10">
    <div class="text-center"><div class="il mb-4"><i class="fa-solid fa-leaf"></i></div><h1 class="text-3xl font-bold text-bark mb-2">Anti-Inflammatory Challenge</h1><p class="text-sm text-gray-500 mb-8">Eat well, together.</p></div>
    <div class="space-y-4 mb-6">
        <div class="text-left"><label class="text-xs text-gray-500 mb-1 block">Your name</label><input id="iN1" class="inf" placeholder="Enter your name" maxlength="10"></div>
        <div class="text-left"><label class="text-xs text-gray-500 mb-1 block">Partner's name</label><input id="iN2" class="inf" placeholder="Enter your partner's name" maxlength="10"></div>
    </div>
    <div class="text-left mb-6"><label class="text-xs text-gray-500 mb-2 block">Challenge length</label><div class="flex gap-3"><button class="db" data-days="30" onclick="sD(this)">30 days</button><button class="db active" data-days="60" onclick="sD(this)">60 days</button><button class="db" data-days="90" onclick="sD(this)">90 days</button></div></div>

    <button onclick="startCh()" class="w-full py-3.5 bg-forest text-white rounded-2xl font-bold text-base hover:bg-mint transition-colors active:scale-[0.97]">Start challenge <i class="fa-solid fa-arrow-right ml-1"></i></button>
    <p class="text-[10px] text-gray-300 text-center mt-3">Your data stays in this browser.</p>
</div>
</div>

<!-- Main app -->
<div id="app" class="relative z-10 pb-20 pt-16" style="display:none;">
<header class="fixed top-0 left-0 right-0 z-50 bg-cream/80 backdrop-blur-lg border-b border-sand/50">
    <div class="max-w-lg mx-auto flex items-center justify-between px-4 h-14">
        <button onclick="togU()" class="flex items-center gap-2 px-3 py-1.5 rounded-full hover:bg-sand/50 transition-colors"><span id="hA" class="w-7 h-7 rounded-full bg-forest text-white flex items-center justify-center text-xs font-bold"></span><span id="hN" class="text-sm font-bold text-bark"></span><i class="fa-solid fa-repeat text-xs text-gray-400"></i></button>
        <div class="flex items-center gap-2"><h1 class="text-sm font-bold text-forest tracking-wide">Anti-Inflammatory Challenge</h1></div>
        <button onclick="showFM()" class="w-9 h-9 rounded-full hover:bg-sand/50 transition-colors flex items-center justify-center text-forest"><i class="fa-solid fa-seedling"></i></button>
    </div>
</header>
<main class="max-w-lg mx-auto px-4">
    <section id="p-ov" class="page active pt-4"><div id="xOC" class="grid grid-cols-2 gap-3 mb-5"></div><div id="xMS" class="card p-4 mb-5"></div><div id="xTR" class="card p-4 mb-5"></div><div id="xPP" class="card p-4"></div></section>
    <section id="p-ci" class="page pt-4"><div id="xCI"></div></section>
    <section id="p-ca" class="page pt-4"><div id="xCA"></div></section>
    <section id="p-pn" class="page pt-4"><div id="xPN"></div></section>
</main>
<nav class="fixed bottom-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-lg border-t border-sand/50">
    <div class="max-w-lg mx-auto flex items-center justify-around h-14">
        <button class="nav-item active flex flex-col items-center gap-0.5 py-1 px-3" data-p="ov" onclick="swP('ov')"><i class="fa-solid fa-chart-pie text-lg"></i><span class="text-[10px] font-bold">Overview</span></button>
        <button class="nav-item flex flex-col items-center gap-0.5 py-1 px-3" data-p="ci" onclick="swP('ci')"><i class="fa-solid fa-pen-to-square text-lg"></i><span class="text-[10px] font-bold">Check-in</span></button>
        <button class="nav-item flex flex-col items-center gap-0.5 py-1 px-3" data-p="ca" onclick="swP('ca')"><i class="fa-regular fa-calendar text-lg"></i><span class="text-[10px] font-bold">Calendar</span></button>
        <button class="nav-item flex flex-col items-center gap-0.5 py-1 px-3" data-p="pn" onclick="swP('pn')"><i class="fa-solid fa-wallet text-lg"></i><span class="text-[10px] font-bold">Penalty Pool</span></button>
    </div>
</nav>
</div>

<!-- Food guide modal -->
<div id="mFM" class="mo" onclick="if(event.target===this)this.classList.remove('show')"><div class="mc p-6"><div class="flex items-center justify-between mb-5"><h2 class="text-lg font-bold text-bark">Anti-Inflammatory Food Guide</h2><button onclick="document.getElementById('mFM').classList.remove('show')" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400"><i class="fa-solid fa-xmark"></i></button></div><div id="fml"></div></div></div>
<!-- Calendar detail/edit/delete modal -->
<div id="mDT" class="mo" onclick="if(event.target===this)this.classList.remove('show')"><div class="mc p-6"><div class="flex items-center justify-between mb-4"><h2 id="dTi" class="text-lg font-bold text-bark"></h2><button onclick="document.getElementById('mDT').classList.remove('show')" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400"><i class="fa-solid fa-xmark"></i></button></div><div id="dBd"></div></div></div>
<!-- Check-in caption modal -->
<div id="mSH" class="mo" onclick="if(event.target===this)this.classList.remove('show')"><div class="mc p-6"><div class="flex items-center justify-between mb-4"><h2 class="text-lg font-bold text-bark">Check-in Caption</h2><button onclick="document.getElementById('mSH').classList.remove('show')" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400"><i class="fa-solid fa-xmark"></i></button></div><p class="text-xs text-gray-400 mb-3">Select and copy the text, or use the button below</p><textarea id="shT" class="inf text-sm leading-relaxed" rows="12" readonly style="resize:none;background:#FAFAF8;"></textarea><button onclick="cpSH()" class="w-full mt-3 py-3 bg-terra text-white rounded-xl font-bold text-sm hover:bg-terra/90 transition-colors active:scale-[0.97]"><i class="fa-solid fa-copy mr-1"></i> Copy caption</button></div></div>

<script>
/* ===== Constants ===== */
const SK='anti_inflam_v3';
const SL=['','Poor','Fair','Okay','Good','Great'],SE=['','😫','😐','🙂','😊','🤩'];
const MS=[{d:7,t:'First Spark',x:'The habit begins'},{d:14,t:'Finding Rhythm',x:'Your body is changing'},{d:21,t:'Transformed',x:'Anti-inflammatory eating feels natural'},{d:30,t:'Anti-Inflammatory Pro',x:'One month! You did it'},{d:60,t:'Lifestyle Design',x:'Anti-inflammatory living'},{d:90,t:'Legend',x:'Three months! Legendary'}];
const FD={'Quality Protein':['Salmon','Sardines','Saury','Chicken breast','Eggs','Tofu','Edamame','Shrimp'],'Dark Leafy Greens':['Spinach','Kale','Broccoli','Red cabbage','Tomato','Bell pepper','Asparagus','Celery'],'Healthy Fats':['Avocado','Extra virgin olive oil','Walnuts','Almonds','Flaxseed','Chia seeds'],'Whole Grains':['Brown rice','Oats','Quinoa','Buckwheat','Sweet potato','Pumpkin','Corn'],'Anti-Inflammatory Spices':['Turmeric','Ginger','Garlic','Cinnamon','Rosemary','Thyme','Black pepper'],'Berries & Fruit':['Blueberries','Strawberries','Cherries','Blackberries','Raspberries','Pomegranate'],'Drinks':['Green tea','White tea','Ginger tea','Lemon water','Bone broth','Unsweetened yogurt']};

/* ===== State ===== */
let D=null,cPg='ov',cY=new Date().getFullYear(),cM=new Date().getMonth(),selTd=60;

/* ===== Utilities ===== */
const gt=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fm=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const db2=(a,b)=>Math.round((b-a)/864e5);
const eh=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const av=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
const cu=()=>D.currentUser,ou=()=>cu()==='user1'?'user2':'user1',un=id=>D.users[id].name;
function gSt(u){const c=D.users[u].checkins;let s=0,d=new Date();if(!c[gt()])d.setDate(d.getDate()-1);while(c[fm(d)]){s++;d.setDate(d.getDate()-1)}return s}
function gCc(u){return Object.keys(D.users[u].checkins).length}
function gPt(u){return D.users[u].penalties.reduce((s,p)=>s+p.amount,0)}
function gDs(u,ds){const c=D.users[u].checkins;if(c[ds])return c[ds].cheated?'cheated':'checked';const st=D.challenge.startDate;if(st&&ds>=st&&ds<gt())return'missed';return''}
function gSh(u,m){return Object.keys(D.users[u].checkins).sort().map(d=>D.users[u].checkins[d].scores[m]||0)}
function gBs(u){const ds=Object.keys(D.users[u].checkins).sort();if(!ds.length)return 0;let b=1,c=1;for(let i=1;i<ds.length;i++){if(db2(pd(ds[i-1]),pd(ds[i]))===1){c++;b=Math.max(b,c)}else c=1}return Math.max(b,c)}
function hsh(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return h.toString(36)}

/* ===== Persistence ===== */
function save(){localStorage.setItem(SK,JSON.stringify(D))}
function loadL(){try{const r=localStorage.getItem(SK);if(r){D=JSON.parse(r);return true}}catch(e){}return false}

/* ===== Initialization ===== */
function sD(b){document.querySelectorAll('.db').forEach(x=>x.classList.remove('active'));b.classList.add('active');selTd=parseInt(b.dataset.days)}
function startCh(){
    const n1=document.getElementById('iN1').value.trim(),n2=document.getElementById('iN2').value.trim();
    if(!n1||!n2){showToast('Please enter both names','error');return}
    D={challenge:{startDate:gt(),targetDays:selTd,rewardGoal:'Celebrate together after the challenge'},users:{user1:{name:n1,checkins:{},penalties:[]},user2:{name:n2,checkins:{},penalties:[]}},currentUser:'user1',initialized:true};
    save();document.getElementById('initPage').classList.add('hidden');document.getElementById('app').style.display='block';rAll()
}
async function init(){
    loadL();
    if(D&&D.initialized){document.getElementById('initPage').classList.add('hidden');document.getElementById('app').style.display='block';rAll()}
}

/* ===== Pages ===== */
function swP(p){cPg=p;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.p===p));rP(p)}
function togU(){D.currentUser=ou();save();rAll();showToast('Switched to '+un(cu()),'info')}
function rAll(){uH();rP(cPg)}
function uH(){document.getElementById('hA').textContent=un(cu()).charAt(0);document.getElementById('hN').textContent=un(cu())}
function rP(p){uH();if(p==='ov')rOV();else if(p==='ci')rCI();else if(p==='ca')rCA();else if(p==='pn')rPN()}

/* ===== Overview ===== */
function rOV(){rOC();rMS();rTR();rPP()}
function rOC(){
    document.getElementById('xOC').innerHTML=['user1','user2'].map(uid=>{
        const cc=gCc(uid),tt=D.challenge.targetDays,pct=Math.min(100,Math.round(cc/tt*100)),sk=gSt(uid),pn=gPt(uid),ic=uid===cu();
        const ci=2*Math.PI*38,of=ci-(pct/100)*ci,rc=uid==='user1'?'#2D6A4F':'#E76F51';
        return`<div class="card p-4 ${ic?'ring-2 ring-forest/30':''} cursor-pointer" onclick="D.currentUser='${uid}';save();rAll()"><div class="flex items-center gap-2 mb-3"><span class="w-6 h-6 rounded-full text-white text-xs flex items-center justify-center font-bold" style="background:${rc}">${un(uid).charAt(0)}</span><span class="text-sm font-bold truncate">${un(uid)}</span>${ic?'<span class="text-[10px] text-forest bg-forest/10 px-1.5 py-0.5 rounded-full font-bold">Current</span>':''}</div><div class="flex justify-center mb-2 relative"><svg width="90" height="90" class="progress-ring"><circle class="progress-ring__bg" cx="45" cy="45" r="38" fill="none" stroke-width="6"/><circle class="progress-ring__fill" cx="45" cy="45" r="38" fill="none" stroke="${rc}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${ci}" stroke-dashoffset="${of}"/></svg><div class="absolute inset-0 flex flex-col items-center justify-center"><span class="text-xl font-bold text-bark">${pct}%</span><span class="text-[10px] text-gray-400">${cc}/${tt}</span></div></div><div class="flex items-center justify-between text-xs"><span class="${sk>0?'text-terra font-bold':'text-gray-400'}">${sk>0?'<span class="fire">🔥</span> '+sk+' days':'No streak yet'}</span><span class="${pn>0?'text-red-500':'text-gray-400'}">${pn>0?'$'+pn:'No penalty'}</span></div></div>`
    }).join('')
}
function rMS(){const b=gBs(cu());document.getElementById('xMS').innerHTML=`<h3 class="text-sm font-bold text-bark mb-3"><i class="fa-solid fa-trophy text-terra mr-1.5"></i>Milestones</h3><div class="grid grid-cols-2 gap-2">${MS.map(m=>{const u=b>=m.d;return`<div class="flex items-center gap-2 p-2.5 rounded-xl ${u?'bg-forest/5':'bg-gray-50'}"><span class="text-lg">${u?'🏅':'🔒'}</span><div><div class="text-xs font-bold ${u?'text-forest':'text-gray-400'}">${m.t}</div><div class="text-[10px] ${u?'text-gray-500':'text-gray-300'}">${m.d} days · ${m.x}</div></div></div>`}).join('')}</div>`}
function rTR(){
    const ms=[{k:'energy',l:'Energy',c:'#2D6A4F'},{k:'sleep',l:'Sleep',c:'#5B8C5A'},{k:'skin',l:'Skin',c:'#E76F51'},{k:'digestion',l:'Digestion',c:'#F4A261'}];
    document.getElementById('xTR').innerHTML=`<h3 class="text-sm font-bold text-bark mb-3"><i class="fa-solid fa-chart-line text-mint mr-1.5"></i>${un(cu())}'s body trends</h3><div class="grid grid-cols-2 gap-3">${ms.map(m=>{const d=gSh(cu(),m.k).slice(-14);return`<div class="p-3 rounded-xl bg-gray-50/80"><div class="flex items-center justify-between mb-2"><span class="text-xs font-bold" style="color:${m.c}">${m.l}</span>${d.length>0?'<span class="text-xs text-gray-400">Avg '+av(d).toFixed(1)+'</span>':''}</div>${d.length>=2?spL(d,m.c):'<div class="text-[11px] text-gray-300">Trends appear after two days</div>'}</div>`}).join('')}</div>`
}
function spL(d,c){const w=140,h=36,p=4;const pts=d.map((v,i)=>`${p+(i/(d.length-1))*(w-p*2)},${p+(1-(v-1)/4)*(h-p*2)}`);const ar=[...pts,`${pts[pts.length-1].split(',')[0]},${h}`,`${pts[0].split(',')[0]},${h}`];return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polygon points="${ar.join(' ')}" fill="${c}" opacity="0.08"/><polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length-1].split(',')[0]}" cy="${pts[pts.length-1].split(',')[1]}" r="3" fill="${c}"/></svg>`}
function rPP(){const t=gPt('user1')+gPt('user2');document.getElementById('xPP').innerHTML=`<div class="flex items-center justify-between"><h3 class="text-sm font-bold text-bark"><i class="fa-solid fa-piggy-bank text-terra mr-1.5"></i>Penalty Pool</h3><button onclick="swP('pn')" class="text-xs text-forest font-bold">Details <i class="fa-solid fa-chevron-right text-[10px]"></i></button></div><div class="mt-3 flex items-end gap-2"><span class="text-3xl font-bold text-terra">$${t}</span><span class="text-xs text-gray-400 mb-1">${t>0?'Total penalties':'No penalties yet'}</span></div>${t>0?'<div class="mt-2 text-xs text-gray-500"><i class="fa-solid fa-bullseye text-terra mr-1"></i>Goal: '+eh(D.challenge.rewardGoal)+'</div>':''}`}

/* ===== Check-in ===== */

    const el=document.getElementById('xCI'),td=gt(),ci=D.users[cu()].checkins[td],dn=db2(pd(D.challenge.startDate),pd(td))+1,ml={breakfast:'Breakfast',lunch:'Lunch',dinner:'Dinner'};
    if(ci){
        el.innerHTML=`<div class="card p-5 text-center mb-4"><div class="w-16 h-16 rounded-full bg-mint/20 flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-check text-2xl text-forest"></i></div><h2 class="text-lg font-bold text-bark mb-1">Checked in today</h2><p class="text-sm text-gray-400">Day ${dn} · ${ci.cheated?'<span class="text-red-500">(slip recorded)</span>':'Perfect anti-inflammatory day'}</p></div><div class="card p-4 mb-3"><h3 class="text-xs font-bold text-gray-400 mb-2">Today's meals</h3>${['breakfast','lunch','dinner'].map(m=>ci.meals[m]?`<div class="mb-1.5"><span class="text-xs font-bold text-forest">${ml[m]}</span><p class="text-sm text-bark">${eh(ci.meals[m])}</p></div>`:'').join('')}${ci.meals.snack?'<div><span class="text-xs font-bold text-forest">Snack</span><p class="text-sm text-bark">'+eh(ci.meals.snack)+'</p></div>':''}</div><div class="card p-4 mb-3"><h3 class="text-xs font-bold text-gray-400 mb-2">How you feel</h3><div class="grid grid-cols-4 gap-2">${['energy','sleep','skin','digestion'].map(m=>{const l={energy:'Energy',sleep:'Sleep',skin:'Skin',digestion:'Digestion'},v=ci.scores[m];return`<div class="text-center"><div class="text-lg">${SE[v]}</div><div class="text-[10px] text-gray-400">${l[m]}</div><div class="text-xs font-bold text-bark">${v}/5</div></div>`}).join('')}</div></div>${ci.note?'<div class="card p-4 mb-3"><h3 class="text-xs font-bold text-gray-400 mb-1">Notes</h3><p class="text-sm text-bark">'+eh(ci.note)+'</p></div>':''}<div class="p-4 rounded-2xl bg-gradient-to-r from-terra/10 to-amber-50 border-2 border-dashed border-terra/30 mb-3"><div class="flex items-center gap-2 mb-2"><i class="fa-solid fa-share-nodes text-terra"></i><span class="text-sm font-bold text-terra">Share your check-in</span></div><p class="text-xs text-gray-400 mb-3">Generate a caption that mentions your partner</p><button onclick="genSH()" class="w-full py-3 bg-terra text-white rounded-xl font-bold text-sm hover:bg-terra/90 transition-colors active:scale-[0.97]"><i class="fa-solid fa-copy mr-1"></i> Generate & copy caption</button></div>`
    }else{
        const yd=fm(new Date(Date.now()-864e5));let w='';
        if(yd>=D.challenge.startDate&&!D.users[cu()].checkins[yd])w=`<div class="card p-4 mb-4 border-2 border-red-200 bg-red-50/50"><div class="flex items-center gap-2 mb-2"><i class="fa-solid fa-triangle-exclamation text-red-500"></i><span class="text-sm font-bold text-red-600">Missed yesterday</span></div><p class="text-xs text-red-500 mb-2">Missed check-in penalty: $10</p><button onclick="addMP('${yd}')" class="px-4 py-1.5 bg-red-500 text-white text-xs rounded-lg font-bold hover:bg-red-600 transition-colors">Confirm missed check-in ($10)</button></div>`;
        const ml2={breakfast:'Breakfast',lunch:'Lunch',dinner:'Dinner',snack:'Snack (optional)'};
        el.innerHTML=`${w}<div class="card p-5 mb-4 text-center"><div class="text-xs text-gray-400 mb-1">${td}</div><h2 class="text-xl font-bold text-bark">Day ${dn} check-in</h2></div><div class="card p-4 mb-3"><h3 class="text-sm font-bold text-bark mb-3"><i class="fa-solid fa-utensils text-forest mr-1.5"></i>Today's meals</h3><div class="space-y-3">${['breakfast','lunch','dinner','snack'].map(m=>`<div><label class="text-xs font-bold text-gray-500 mb-1 block">${ml2[m]}${m!=='snack'?' *':''}</label><textarea id="m_${m}" class="inf" rows="2" placeholder="What did you eat?"></textarea></div>`).join('')}</div></div><div class="card p-4 mb-3"><h3 class="text-sm font-bold text-bark mb-3"><i class="fa-solid fa-heart-pulse text-terra mr-1.5"></i>How you feel</h3><div class="space-y-4">${['energy','sleep','skin','digestion'].map(m=>{const l={energy:'Energy',sleep:'Sleep',skin:'Skin',digestion:'Digestion'};return`<div><div class="flex items-center justify-between mb-1"><span class="text-xs font-bold text-gray-500">${l[m]}</span><span id="sl_${m}" class="text-sm font-bold">${SE[3]} ${SL[3]}</span></div><input type="range" id="sc_${m}" min="1" max="5" value="3" oninput="document.getElementById('sl_${m}').textContent=SE[this.value]+' '+SL[this.value]"></div>`}).join('')}</div></div><div class="card p-4 mb-3"><h3 class="text-sm font-bold text-bark mb-2"><i class="fa-regular fa-note-sticky text-gray-400 mr-1.5"></i>Notes</h3><textarea id="ciN" class="inf" rows="2" placeholder="How you feel today, any changes..."></textarea></div><div class="p-3 rounded-2xl bg-amber-50/60 border border-amber-200/50 mb-3"><div class="flex items-center gap-2 mb-2"><i class="fa-solid fa-share-nodes text-terra text-sm"></i><span class="text-xs font-bold text-terra">Caption preview</span></div><div id="pvT" class="text-xs text-gray-500 bg-white/60 rounded-lg p-2.5 min-h-[60px] mb-2 whitespace-pre-line leading-relaxed">Fill in your day, then preview the caption...</div><button onclick="pvSH()" class="w-full py-2 bg-terra/10 text-terra rounded-lg text-xs font-bold hover:bg-terra/20 transition-colors"><i class="fa-solid fa-eye mr-1"></i> Refresh preview</button></div><button onclick="subCI(true)" class="w-full py-3 bg-red-50 text-red-500 rounded-2xl font-bold text-sm mb-3 hover:bg-red-100 transition-colors border border-red-200"><i class="fa-solid fa-hand mr-1"></i> I slipped (honest, half penalty: $5)</button><button onclick="subCI(false)" class="w-full py-3.5 bg-forest text-white rounded-2xl font-bold text-base hover:bg-mint transition-colors active:scale-[0.97]">Submit check-in <i class="fa-solid fa-check ml-1"></i></button>`
    }

/* ===== Share caption ===== */
function bST(meals,sc,note){const dn=db2(pd(D.challenge.startDate),pd(gt()))+1;let t='Anti-Inflammatory Challenge Day '+dn+'\n━━━━━━━━━━━━\n';if(meals.breakfast)t+='Breakfast: '+meals.breakfast+'\n';if(meals.lunch)t+='Lunch: '+meals.lunch+'\n';if(meals.dinner)t+='Dinner: '+meals.dinner+'\n';if(meals.snack)t+='Snack: '+meals.snack+'\n';t+='━━━━━━━━━━━━\nEnergy '+'⭐'.repeat(sc.energy)+' Sleep '+'⭐'.repeat(sc.sleep)+'\nSkin '+'⭐'.repeat(sc.skin)+' Digestion '+'⭐'.repeat(sc.digestion)+'\n';if(note)t+='\n'+note+'\n';t+='\n@'+un(ou())+' Did you check in today too?';t+='\n\n#AntiInflammatoryChallenge #HealthyHabits #DailyCheckIn';return t}
function pvSH(){const m={},s={};['breakfast','lunch','dinner','snack'].forEach(k=>{const e=document.getElementById('m_'+k);m[k]=e?e.value.trim():''});['energy','sleep','skin','digestion'].forEach(k=>{const e=document.getElementById('sc_'+k);s[k]=e?parseInt(e.value):3});const n=document.getElementById('ciN');document.getElementById('pvT').textContent=bST(m,s,n?n.value.trim():'')}
function genSH(){const ci=D.users[cu()].checkins[gt()];if(!ci){showToast('No check-in found for today','error');return}document.getElementById('shT').value=bST(ci.meals,ci.scores,ci.note);document.getElementById('mSH').classList.add('show')}
function cpSH(){const t=document.getElementById('shT');t.select();t.setSelectionRange(0,99999);if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t.value).then(()=>{showToast('Copied to clipboard','success');document.getElementById('mSH').classList.remove('show')}).catch(()=>fbCp(t))}else fbCp(t)}
function fbCp(t){try{if(document.execCommand('copy')){showToast('Copied to clipboard','success');document.getElementById('mSH').classList.remove('show')}else showToast('Please select and copy the text manually','info')}catch(e){showToast('Please select and copy the text manually','info')}}

/* ===== Submit check-in ===== */
function subCI(ch){
    const m={},ml={breakfast:'Breakfast',lunch:'Lunch',dinner:'Dinner'};
    for(const k of['breakfast','lunch','dinner']){const v=document.getElementById('m_'+k).value.trim();if(!v){showToast('Please fill in '+ml[k],'error');return}m[k]=v}
    m.snack=document.getElementById('m_snack').value.trim();const s={};['energy','sleep','skin','digestion'].forEach(k=>{s[k]=parseInt(document.getElementById('sc_'+k).value)});
    const note=document.getElementById('ciN').value.trim();
    D.users[cu()].checkins[gt()]={meals:m,scores:s,note,cheated:ch,timestamp:Date.now()};
    if(ch){D.users[cu()].penalties.push({date:gt(),amount:5,reason:'Self-reported slip (half penalty)'});showToast('Slip recorded ($5, honest half penalty)','info')}else showToast('Check-in saved!','success');
    save();showConfetti();rCI()
}
function addMP(d){D.users[cu()].penalties.push({date:d,amount:10,reason:d+' missed check-in'});save();showToast('Missed check-in penalty recorded ($10)','info');rCI()}

/* ===== Calendar + edit/delete ===== */
function rCA(){
    const el=document.getElementById('xCA'),y=cY,mo=cM,mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
    const fd=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate(),td=gt(),st=D.challenge.startDate;
    let g='';const of2=(fd+6)%7;for(let i=0;i<of2;i++)g+='<div></div>';
    for(let d=1;d<=dim;d++){const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,s=gDs(cu(),ds),iT=ds===td,iF=ds>td,iB=st&&ds<st;let c='cal-day';if(iF||iB)c+=' future';else if(s==='checked')c+=' checked';else if(s==='cheated')c+=' cheated';else if(s==='missed')c+=' missed';if(iT)c+=' today';const ck=!iF&&!iB&&s;g+=`<div class="${c}"${ck?` onclick="sDD('${ds}')"`:''}>${d}</div>`}
    el.innerHTML=`<div class="card p-4 mb-4"><div class="flex items-center justify-between mb-4"><button onclick="cMo(-1)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500"><i class="fa-solid fa-chevron-left text-xs"></i></button><h3 class="text-base font-bold text-bark">${mn[mo]} ${y}</h3><button onclick="cMo(1)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500"><i class="fa-solid fa-chevron-right text-xs"></i></button></div><div class="grid grid-cols-7 gap-1 mb-2">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>'<div class="text-center text-[10px] font-bold text-gray-400 py-1">'+d+'</div>').join('')}</div><div class="grid grid-cols-7 gap-1">${g}</div><div class="flex items-center justify-center gap-4 mt-3 text-[10px] text-gray-400"><span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-[#D8F3DC]"></span>Checked in</span><span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-[#FEE2E2]"></span>Slip</span><span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-[#F3F0EB]"></span>Missed</span></div></div><div class="card p-4"><h3 class="text-sm font-bold text-bark mb-2">${un(cu())}'s stats</h3><div class="grid grid-cols-3 gap-3 text-center"><div><div class="text-xl font-bold text-forest">${gCc(cu())}</div><div class="text-[10px] text-gray-400">Days checked in</div></div><div><div class="text-xl font-bold text-terra">${gSt(cu())}</div><div class="text-[10px] text-gray-400">Current streak</div></div><div><div class="text-xl font-bold text-bark">${gBs(cu())}</div><div class="text-[10px] text-gray-400">Best streak</div></div></div></div>`
}
function cMo(d){cM+=d;if(cM<0){cM=11;cY--}if(cM>11){cM=0;cY++}rCA()}

/* Calendar modal states: view -> edit -> confirm delete */

/* ===== Penalties ===== */

function aMP(){const uid=document.getElementById('mU').value,amt=parseInt(document.getElementById('mA').value)||10,rsn=document.getElementById('mR').value.trim()||'Manual entry';D.users[uid].penalties.push({date:gt(),amount:Math.max(1,amt),reason:rsn});save();showToast('Added a $'+amt+' penalty for '+un(uid),'info');rPN()}

/* ===== Food guide ===== */
function showFM(){document.getElementById('fml').innerHTML=Object.entries(FD).map(([c,items])=>'<div class="mb-4"><h4 class="text-xs font-bold text-forest mb-2">'+c+'</h4><div>'+items.map(f=>'<span class="ft">'+f+'</span>').join('')+'</div></div>').join('');document.getElementById('mFM').classList.add('show')}

/* ===== Toast & Confetti ===== */
function showToast(m,t){const e=document.getElementById('toast');e.textContent=m;e.className='toast '+(t||'success')+' show';setTimeout(()=>e.classList.remove('show'),2500)}
function showConfetti(){const cv=document.getElementById('cc'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;cv.style.display='block';const cs=['#2D6A4F','#52B788','#E76F51','#F4A261','#E9C46A','#95D5B2'];const ps=Array.from({length:80},()=>({x:cv.width*.5+(Math.random()-.5)*cv.width*.6,y:cv.height*.3+(Math.random()-.5)*100,w:Math.random()*10+4,h:Math.random()*6+2,c:cs[Math.floor(Math.random()*cs.length)],vx:(Math.random()-.5)*8,vy:-(Math.random()*6+3),r:Math.random()*360,rv:(Math.random()-.5)*12,o:1,g:.12+Math.random()*.05}));let f=0;(function go(){ctx.clearRect(0,0,cv.width,cv.height);let a=false;for(const p of ps){p.x+=p.vx;p.vy+=p.g;p.y+=p.vy;p.vx*=.99;p.r+=p.rv;if(f>50)p.o-=.015;if(p.o>0&&p.y<cv.height+30){a=true;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);ctx.globalAlpha=Math.max(0,p.o);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}}f++;if(a)requestAnimationFrame(go);else cv.style.display='none'})()}

document.addEventListener('DOMContentLoaded',init);
